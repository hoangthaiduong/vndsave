<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#F8FAFC" />
  <meta name="description" content="VND Save — Take Control of Your Money." />
  <link rel="icon" type="image/svg+xml" href="./public/favicon.svg" />
  <title>VND Save</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#F8FAFC; }
    #vnd-app-stage { position:fixed; inset:0; overflow:hidden; background:#F8FAFC; }
    .vnd-app-frame { position:absolute; inset:0; width:100%; height:100%; border:0; background:#F8FAFC; opacity:0; visibility:hidden; pointer-events:none; transition:opacity 220ms cubic-bezier(.2,.75,.25,1), visibility 0s linear 220ms; }
    .vnd-app-frame.is-preparing { visibility:visible; opacity:0; pointer-events:none; transition:none; }
    .vnd-app-frame.is-active { z-index:2; visibility:visible; opacity:1; pointer-events:auto; transition:opacity 220ms cubic-bezier(.2,.75,.25,1); }
    .vnd-app-frame.is-leaving { z-index:1; visibility:visible; opacity:0; pointer-events:none; transition:opacity 220ms cubic-bezier(.2,.75,.25,1), visibility 0s linear 220ms; }
    #vnd-boot { position:fixed; inset:0; z-index:10; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:24px; color:#64748B; background:#F8FAFC; font:13px Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; opacity:1; visibility:visible; transition:opacity 280ms ease, visibility 0s linear 280ms; }
    #vnd-boot.is-hidden { opacity:0; visibility:hidden; pointer-events:none; }
    .vnd-boot-logo { width:62px; height:62px; margin-bottom:8px; }
    .vnd-boot-title { color:#0F172A; font-size:20px; font-weight:750; letter-spacing:-.5px; }
    .vnd-boot-progress { width:172px; height:4px; overflow:hidden; margin-top:12px; border-radius:999px; background:#E2E8F0; }
    .vnd-boot-progress span { display:block; width:44%; height:100%; border-radius:inherit; background:#2563EB; animation:vnd-boot 1.1s ease-in-out infinite alternate; }
    @keyframes vnd-boot { to { transform:translateX(128%); } }
    #vnd-nav-error { position:fixed; z-index:20; left:50%; bottom:22px; transform:translateX(-50%); display:none; max-width:min(520px,calc(100vw - 32px)); padding:11px 15px; border:1px solid #FECACA; border-radius:10px; background:#FFF; color:#991B1B; box-shadow:0 8px 30px rgba(15,23,42,.12); font:13px/1.45 Inter,ui-sans-serif,system-ui,sans-serif; }
    #vnd-nav-error.is-visible { display:block; }
    @media (prefers-reduced-motion: reduce) { .vnd-app-frame, #vnd-boot { transition:none!important; } .vnd-boot-progress span { animation:none!important; } }
  </style>
</head>
<body>
  <main id="vnd-app-stage" aria-label="VND Save">
    <iframe id="vnd-frame-a" class="vnd-app-frame is-preparing" title="VND Save" loading="eager"></iframe>
    <iframe id="vnd-frame-b" class="vnd-app-frame" title="VND Save page" loading="eager"></iframe>
  </main>
  <div id="vnd-boot" role="status" aria-live="polite">
    <img class="vnd-boot-logo" src="./public/logo.svg" alt="" />
    <div class="vnd-boot-title">VND Save</div>
    <div>Đang chuẩn bị không gian tài chính của bạn…</div>
    <div class="vnd-boot-progress"><span></span></div>
  </div>
  <div id="vnd-nav-error" role="alert">Không thể mở trang mới. Trang hiện tại vẫn được giữ nguyên; hãy thử lại.</div>
  <script>
    (() => {
      'use strict';
      const CHANNEL = 'VND_SAVE_APP_NAV_V1';
      const files = {
        dashboard: 'dashboard.html', transactions: 'transactions.html', budgets: 'budgets.html',
        analytics: 'analytics.html', insights: 'insights.html', goals: 'goals.html',
        reports: 'reports.html', settings: 'settings.html'
      };
      const titles = {
        dashboard: 'Tổng quan', transactions: 'Giao dịch', budgets: 'Ngân sách',
        analytics: 'Phân tích', insights: 'Góc nhìn tài chính', goals: 'Mục tiêu tiết kiệm',
        reports: 'Báo cáo', settings: 'Cài đặt'
      };
      const frames = {
        a: document.getElementById('vnd-frame-a'),
        b: document.getElementById('vnd-frame-b')
      };
      const boot = document.getElementById('vnd-boot');
      const errorBox = document.getElementById('vnd-nav-error');
      const reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const transitionMs = reducedMotion ? 0 : 230;
      let activeKey = null;
      let activePage = null;
      let pending = null;
      let pendingTimer = null;

      function pageFromHash() {
        const page = (location.hash || '').slice(1).toLowerCase();
        return Object.prototype.hasOwnProperty.call(files, page) ? page : 'dashboard';
      }
      function setHash(page, replace) {
        const hash = '#' + page;
        if (location.hash === hash) return;
        if (replace) history.replaceState({ page }, '', hash);
        else history.pushState({ page }, '', hash);
      }
      function hideBoot() {
        boot.classList.add('is-hidden');
        window.setTimeout(() => { boot.hidden = true; }, reducedMotion ? 0 : 320);
      }
      function showError() {
        errorBox.classList.add('is-visible');
        window.setTimeout(() => errorBox.classList.remove('is-visible'), 3800);
      }
      function cancelPending() {
        if (!pending) return;
        if (pendingTimer) window.clearTimeout(pendingTimer);
        pendingTimer = null;
        const frame = pending.frame;
        frame.className = 'vnd-app-frame';
        frame.src = 'about:blank';
        pending = null;
      }
      function loadPage(page, options) {
        options = options || {};
        if (!files[page]) return;
        if (!pending && page === activePage) return;
        if (pending && pending.page === page) return;
        cancelPending();
        const initial = activeKey === null;
        const targetKey = initial ? 'a' : (activeKey === 'a' ? 'b' : 'a');
        const target = frames[targetKey];
        target.className = 'vnd-app-frame is-preparing';
        pending = { key: targetKey, frame: target, page, initial, updateHistory: options.updateHistory !== false };
        errorBox.classList.remove('is-visible');
        target.src = './' + files[page] + '?vnd-shell=1';
        pendingTimer = window.setTimeout(() => {
          if (pending && pending.frame === target) {
            cancelPending();
            showError();
          }
        }, 18000);
      }
      function completePage(frameWindow, page) {
        if (!pending || pending.frame.contentWindow !== frameWindow || pending.page !== page) return;
        if (pendingTimer) window.clearTimeout(pendingTimer);
        pendingTimer = null;
        const next = pending;
        pending = null;
        const previousKey = activeKey;
        const previous = previousKey ? frames[previousKey] : null;
        next.frame.className = 'vnd-app-frame is-active';
        activeKey = next.key;
        activePage = page;
        document.title = titles[page] + ' — VND Save';
        if (next.updateHistory) setHash(page, next.initial);
        if (previous && previous !== next.frame) {
          previous.className = 'vnd-app-frame is-leaving';
          window.setTimeout(() => {
            if (previous.classList.contains('is-leaving')) {
              previous.className = 'vnd-app-frame';
              previous.src = 'about:blank';
            }
          }, transitionMs + 35);
        }
        if (next.initial) hideBoot();
      }

      function navigateFromFrame(page) {
        if (!files[page] || page === activePage) return;
        setHash(page, false);
        loadPage(page, { updateHistory: false });
      }
      window.addEventListener('message', event => {
        const message = event.data;
        if (!message || message.channel !== CHANNEL) return;
        if (message.type === 'navigate') {
          const allowedSource = (activeKey && frames[activeKey].contentWindow === event.source);
          if (allowedSource) navigateFromFrame(message.page);
          return;
        }
        if (message.type === 'ready' && typeof message.page === 'string') {
          completePage(event.source, message.page);
        }
      });
      window.addEventListener('popstate', () => loadPage(pageFromHash(), { updateHistory: false }));

      const firstPage = pageFromHash();
      if (!location.hash) setHash(firstPage, true);
      loadPage(firstPage, { updateHistory: false });
    })();
  </script>
</body>
</html>
