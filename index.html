.grid{gap:19px}.metrics{margin-bottom:21px}.card{border-radius:16px;padding:23px;border-color:var(--border);box-shadow:var(--shadow);transition:box-shadow .2s ease,border-color .2s ease,transform .2s ease}.card:hover{box-shadow:var(--shadow-hover);border-color:#d8e2f0}.metric-label{font-size:14px;font-weight:600;letter-spacing:-.01em}.metric-value{font-size:29px;line-height:1.2;font-weight:750;letter-spacing:-.045em;margin:14px 0 7px;font-variant-numeric:tabular-nums}.sub{font-size:13px;line-height:1.5}.cols{gap:19px;margin-bottom:20px}.card h3{font-size:17px;font-weight:700;letter-spacing:-.025em;margin-bottom:19px}.barrow{font-size:14px;gap:13px}.track{height:9px;background:#edf1f7}body.dark .track{background:#26364d}.fill{background:linear-gradient(90deg,#2563eb,#5c8df5)}

.toolbar{gap:11px;margin-bottom:19px}.toolbar input{max-width:360px}.sectionhead{margin:28px 0 15px}.sectionhead h3{font-size:18px}.notice{border:1px solid #dbeafe;background:#f0f6ff;color:#244c91;border-radius:12px;padding:15px 17px;font-size:14px}body.dark .notice{border-color:#29466d;background:#142947;color:#c2d9ff}

.empty{padding:48px 18px;font-size:14px}.empty b{font-size:16px}.onboard{max-width:790px}.onboard .card{padding:38px;border-radius:20px}.onboard h1{font-size:30px;letter-spacing:-.05em}.footer{font-size:12px;color:#95a1b3}

<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), money=n=>new Intl.NumberFormat('vi-VN',{style:'currency',currency:'VND',maximumFractionDigits:0}).format(Number(n)||0), today=()=>new Date().toISOString().slice(0,10), monthNow=()=>today().slice(0,7), uid=()=>crypto.randomUUID?.()||String(Date.now()+Math.random()), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const defaults=['Ăn uống','Giáo dục','Giải trí','Mua sắm','Di chuyển','Hóa đơn','Sức khỏe','Khác'];
let db, useLocalFallback=false, state={profile:null,categories:[],transactions:[],budgets:[],savingsGoals:[],settings:{theme:'light'}},page='dashboard',month=monthNow(),editing=null;
function openDB(){return new Promise((resolve,reject)=>{let r=indexedDB.open('vnd-save-standalone',1);r.onupgradeneeded=()=>r.result.createObjectStore('state');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function load(){try{db=await openDB();return await new Promise((resolve,reject)=>{let r=db.transaction('state').objectStore('state').get('main');r.onsuccess=()=>{if(r.result)state=r.result;resolve()};r.onerror=()=>reject(r.error)})}catch(err){useLocalFallback=true;try{let saved=localStorage.getItem('vnd-save-state');if(saved)state=JSON.parse(saved)}catch(e){throw new Error('IndexedDB và bộ nhớ dự phòng đều không khả dụng. '+e.message)}}}
function persist(){if(useLocalFallback){localStorage.setItem('vnd-save-state',JSON.stringify(state));return Promise.resolve()}return new Promise((resolve,reject)=>{let t=db.transaction('state','readwrite');t.objectStore('state').put(state,'main');t.oncomplete=resolve;t.onerror=()=>reject(t.error)})}
function toast(s){let el=$('#toast');el.textContent=s;el.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.hidden=true,3000)}
const txs=()=>state.transactions.filter(t=>t.date?.slice(0,7)===month), sum=(arr,type)=>arr.filter(t=>t.type===type).reduce((a,t)=>a+Number(t.amount),0), expenses=()=>sum(txs(),'expense'), income=()=>sum(txs(),'income'), balance=()=>sum(state.transactions,'income')-sum(state.transactions,'expense');
function budget(c){let own=state.budgets.find(b=>b.categoryId===c.id&&b.month===month);if(own)return own.amount;let prev=state.budgets.filter(b=>b.categoryId===c.id&&b.month<month).sort((a,b)=>b.month.localeCompare(a.month))[0];return prev?.amount??c.budget??0}
function spent(c){return txs().filter(t=>t.categoryId===c.id&&t.type==='expense').reduce((a,t)=>a+t.amount,0)}
const iconPaths={layoutDashboard:'<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>',arrowLeftRight:'<path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/>',wallet:'<rect x="3" y="5" width="18" height="15" rx="2"/><path d="M3 9h18"/><path d="M16 15h.01"/><path d="M3 5.5 17 3"/>',chart:'<path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-5 5"/><path d="M15 9h4v4"/>',lightbulb:'<path d="M9 18h6"/><path d="M10 22h4"/><path d="M8.5 14.5A6 6 0 1 1 15.5 14.5c-.8.7-1.3 1.5-1.5 2.5h-4c-.2-1-.7-1.8-1.5-2.5Z"/>',piggyBank:'<path d="M19 5c-2-2-5-2-8-1-3 1-5 3-6 6l-2 1v4l3 1 2 3h8l2-3 3-1v-4l-2-1"/><path d="M14 9h.01M7 5 6 3M18 4l1-2"/>',fileChart:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6M8 17v-3M12 17v-6M16 17v-5"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.4 1.1-1.4 2.4-1.7-.6a8 8 0 0 1-1.7 1l-.3 1.8h-2.8l-.3-1.8a8 8 0 0 1-1.7-1l-1.7.6-1.4-2.4L5.3 15a8 8 0 0 1 0-2l-1.4-1.1 1.4-2.4 1.7.6a8 8 0 0 1 1.7-1L9 7.3h2.8l.3 1.8a8 8 0 0 1 1.7 1l1.7-.6 1.4 2.4-1.4 1.1a8 8 0 0 1-.1 2Z"/>'};
function ico(name,size=19){return `<svg class="lucide" width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true">${iconPaths[name]||'<circle cx="12" cy="12" r="9"/>'}</svg>`}
const nav=[['dashboard','layoutDashboard','Tổng quan'],['transactions','arrowLeftRight','Giao dịch'],['budgets','wallet','Ngân sách'],['analytics','chart','Phân tích'],['insights','lightbulb','Monthly Insights'],['savings','piggyBank','Tiết kiệm'],['reports','fileChart','Báo cáo'],['settings','settings','Cài đặt']];
function shell(){document.body.classList.toggle('dark',state.settings.theme==='dark');$('#app').innerHTML=`<aside class="sidebar"><div class="brand"><img src="./public/assets/logo.svg">VND Save</div><div class="navlabel">KHÔNG GIAN CỦA BẠN</div><nav class="nav">${nav.map(([id,ic,l])=>`<button data-page="${id}" class="${page===id?'active':''}"><span class="ico">${ico(ic)}</span>${l}</button>`).join('')}</nav><div class="sidebar-bottom">Dữ liệu được lưu trên thiết bị này.<br>Hãy xuất backup định kỳ để bảo vệ dữ liệu.</div></aside><main class="main"><header class="top"><div><div class="crumb">VND SAVE / ${nav.find(x=>x[0]===page)?.[2].toUpperCase()}</div><h1>${nav.find(x=>x[0]===page)?.[2]}</h1></div><div class="topright"><span class="save">● Đã lưu trên thiết bị</span><button class="btn smallbtn" data-action="theme">${state.settings.theme==='dark'?'<svg class="lucide" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>':'<svg class="lucide" viewBox="0 0 24 24"><path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z"/></svg>'}</button><div class="avatar">${esc(state.profile?.name?.[0]||'V')}</div></div></header><section class="content" id="view"></section><div class="footer">© ${new Date().getFullYear()} VND Save · Dữ liệu lưu cục bộ bằng IndexedDB</div></main>`;renderPage()}
function intro(title,desc,button=''){return `<div class="intro"><div><h2>${title}</h2><p>${desc}</p></div>${button}</div>`}
function metric(label,val,note=''){return `<div class="card"><div class="metric-label">${label}</div><div class="metric-value">${val}</div><div class="sub">${note}</div></div>`}
function progress(label,used,limit){let pct=limit>0?used/limit*100:0;return `<div class="barrow"><span>${esc(label)}</span><div class="track"><div class="fill" style="width:${Math.min(100,pct)}%;background:${pct>=100?'#dc2626':pct>=80?'#d97706':'#2563eb'}"></div></div><b>${limit?Math.round(pct)+'%':'—'}</b></div>`}
function txTable(list){if(!list.length)return `<div class="empty"><b>Chưa có giao dịch</b>Hãy thêm giao dịch đầu tiên để bắt đầu theo dõi tài chính.</div>`;return `<div class="tablewrap"><table><thead><tr><th>Giao dịch</th><th>Danh mục</th><th>Ngày</th><th>Loại</th><th>Số tiền</th><th></th></tr></thead><tbody>${list.map(t=>`<tr><td><b>${esc(t.title)}</b><div class="sub">${esc(t.note||'')}</div></td><td>${esc(t.categoryName)}</td><td>${esc(t.date)}</td><td><span class="pill ${t.type==='income'?'green':'red'}">${t.type==='income'?'Thu nhập':'Chi tiêu'}</span></td><td class="${t.type==='income'?'positive':'negative'}"><b>${t.type==='income'?'+':'−'}${money(t.amount)}</b></td><td><button class="btn smallbtn" data-edit="${t.id}">Sửa</button> <button class="btn smallbtn danger" data-del="${t.id}">Xóa</button></td></tr>`).join('')}</tbody></table></div>`}
function renderPage(){let v=$('#view');if(!v)return; if(page==='dashboard'){let recent=[...state.transactions].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6);v.innerHTML=intro(`Xin chào, ${esc(state.profile.name)}`,`Tổng quan tài chính · ${month}`,`<input aria-label="Chọn tháng" id="dashboardmonth" type="month" value="${month}" style="width:145px;margin-right:8px"><button class="btn primary" data-action="addtx">＋ Thêm giao dịch</button>`)+`<div class="grid metrics">${metric('Tổng số dư',money(balance()),'Tổng thu nhập trừ tổng chi tiêu')}${metric('Thu nhập tháng',money(income()),'Giao dịch thu nhập trong tháng')}${metric('Chi tiêu tháng',money(expenses()),'Giao dịch chi tiêu trong tháng')}${metric('Ngân sách còn lại',money(state.categories.reduce((a,c)=>a+budget(c)-spent(c),0)),'Theo ngân sách tháng đang xem')}</div><div class="grid cols"><div class="card"><h3>Budget Progress</h3><div class="barlist">${state.categories.map(c=>progress(c.name,spent(c),budget(c))).join('')||'<div class="empty">Chưa có danh mục</div>'}</div></div><div class="card"><h3>Thu nhập và chi tiêu</h3><div style="display:flex;gap:18px;align-items:end;height:170px;padding:15px 12px 0">${[['Thu nhập',income(),'#16a34a'],['Chi tiêu',expenses(),'#2563eb']].map(([l,n,c])=>`<div style="flex:1;text-align:center"><div style="height:${Math.max(5,Math.min(100,(n/Math.max(1,income(),expenses()))*100))}%;background:${c};border-radius:9px 9px 0 0;min-height:5px"></div><b style="font-size:13px">${money(n)}</b><div class="sub">${l}</div></div>`).join('')}</div></div></div><div class="card"><h3>Giao dịch gần đây</h3>${txTable(recent)}</div>`}
else if(page==='transactions'){v.innerHTML=intro('Quản lý giao dịch','Theo dõi tất cả khoản thu nhập và chi tiêu.',`<button class="btn primary" data-action="addtx">＋ Thêm giao dịch</button>`)+`<div class="toolbar"><input id="txsearch" placeholder="Tìm giao dịch..."><select id="txfilter"><option value="all">Tất cả loại</option><option value="income">Thu nhập</option><option value="expense">Chi tiêu</option></select><input id="txmonth" type="month" value="${month}"></div><div class="card" id="txlist">${txTable([...state.transactions].sort((a,b)=>b.date.localeCompare(a.date)))}</div>`}
else if(page==='budgets'){v.innerHTML=intro('Ngân sách hàng tháng','Điều chỉnh giới hạn chi tiêu cho từng danh mục.')+`<div class="toolbar"><input id="budgetmonth" type="month" value="${month}"><button class="btn primary" data-action="addcat">＋ Thêm danh mục</button></div><div class="grid metrics">${metric('Tổng ngân sách',money(state.categories.reduce((a,c)=>a+budget(c),0)),'Tổng hạn mức các danh mục')}${metric('Đã chi',money(expenses()),'Chi tiêu trong tháng')}${metric('Còn lại',money(state.categories.reduce((a,c)=>a+budget(c)-spent(c),0)),'Ngân sách trừ số đã chi')}${metric('Danh mục',state.categories.length,'Đang quản lý')}</div><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(270px,1fr))">${state.categories.map(c=>{let b=budget(c),s=spent(c),p=b?s/b*100:0;return `<div class="card"><div class="goalhead"><b>${esc(c.name)}</b><button class="btn smallbtn" data-editcat="${c.id}">Sửa</button></div><div class="metric-value">${money(s)}</div><div class="sub">Đã chi / ${money(b)}</div><div class="track" style="margin:15px 0"><div class="fill" style="width:${Math.min(100,p)}%;background:${p>=100?'#dc2626':p>=80?'#d97706':'#2563eb'}"></div></div><div class="sub">${b?Math.round(p)+'% đã sử dụng':'Chưa đặt ngân sách'} · Còn ${money(b-s)}</div></div>`}).join('')}</div>`}
else if(page==='analytics'){let total=expenses(),groups=state.categories.map(c=>({name:c.name,n:spent(c)})).filter(x=>x.n).sort((a,b)=>b.n-a.n);v.innerHTML=intro('Phân tích tài chính','Tổng hợp chi tiêu thực tế theo danh mục trong tháng.')+`<div class="grid metrics">${metric('Tổng chi tiêu',money(total),'Trong tháng '+month)}${metric('Tỷ lệ chi tiêu/thu nhập',income()?Math.round(total/income()*100)+'%':'Chưa đủ dữ liệu','Dựa trên thu nhập thực tế')}${metric('Số danh mục phát sinh',groups.length,'Có ghi nhận chi tiêu')}${metric('Giao dịch',txs().length,'Trong tháng đang xem')}</div><div class="card"><h3>Chi tiêu theo danh mục</h3><div class="barlist">${groups.length?groups.map(x=>progress(x.name,x.n,total)).join(''):'<div class="empty">Chưa có dữ liệu chi tiêu trong tháng này.</div>'}</div></div>`}
else if(page==='insights'){let prev=new Date(month+'-15T12:00:00');prev.setMonth(prev.getMonth()-1);let pm=prev.toISOString().slice(0,7),p=sum(state.transactions.filter(t=>t.date?.slice(0,7)===pm),'expense'),e=expenses(),top=[...state.categories].map(c=>({name:c.name,n:spent(c),b:budget(c)})).sort((a,b)=>b.n-a.n)[0];let notes=[];if(p>0)notes.push(`Chi tiêu ${e<p?'giảm':'tăng'} ${Math.round(Math.abs(e-p)/p*100)}% so với tháng trước (${money(Math.abs(e-p))}).`);else if(e>0)notes.push('Chưa có dữ liệu chi tiêu tháng trước để so sánh.');if(top?.n)notes.push(`${top.name} là danh mục có chi tiêu cao nhất: ${money(top.n)}.`);state.categories.filter(c=>budget(c)>0&&spent(c)>=budget(c)*.8).forEach(c=>notes.push(`${c.name} đã sử dụng ${Math.round(spent(c)/budget(c)*100)}% ngân sách.`));if(income()>0)notes.push(`Tỷ lệ tiết kiệm tháng này là ${Math.round((income()-e)/income()*100)}%.`);v.innerHTML=intro('Monthly Insights','Nhận xét được tính tự động từ dữ liệu giao dịch của bạn.')+`<div class="card">${notes.length?notes.map(n=>`<div class="notice">${esc(n)}</div>`).join(''):'<div class="empty"><b>Chưa đủ dữ liệu để phân tích</b>Hãy ghi nhận giao dịch thu nhập và chi tiêu để xem nhận xét.</div>'}</div>`}
else if(page==='savings'){v.innerHTML=intro('Mục tiêu tiết kiệm','Theo dõi tiến độ từng mục tiêu do bạn tạo.',`<button class="btn primary" data-action="addgoal">＋ Tạo mục tiêu</button>`)+`<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(270px,1fr))">${state.savingsGoals.map(g=>`<div class="card goal"><div class="goalhead"><b>${esc(g.name)}</b><button class="btn smallbtn danger" data-delgoal="${g.id}">Xóa</button></div><div class="metric-value">${money(g.saved)}</div><div class="sub">Mục tiêu ${money(g.target)}</div><div class="track"><div class="fill" style="width:${Math.min(100,g.saved/g.target*100)}%"></div></div><div class="sub">${Math.min(100,Math.round(g.saved/g.target*100))}% hoàn thành · Còn ${money(Math.max(0,g.target-g.saved))}</div><div><button class="btn" data-goaladd="${g.id}">＋ Nạp tiền</button> <button class="btn" data-goalremove="${g.id}">− Rút tiền</button></div></div>`).join('')||'<div class="card empty">Chưa có mục tiêu tiết kiệm.</div>'}</div>`}
else if(page==='reports'){let totalIn=sum(txs(),'income'),totalOut=sum(txs(),'expense'),net=totalIn-totalOut;v.innerHTML=intro('Báo cáo tài chính','Báo cáo dựa trên dữ liệu thực tế trong tháng đang chọn.',`<button class="btn primary" data-action="csv">↓ Xuất CSV</button>`)+`<div class="toolbar"><input type="month" id="reportmonth" value="${month}"></div><div class="grid metrics">${metric('Tổng thu nhập',money(totalIn),'')}${metric('Tổng chi tiêu',money(totalOut),'')}${metric('Chênh lệch',money(net),'Thu nhập trừ chi tiêu')}${metric('Tỷ lệ tiết kiệm',totalIn?Math.round(net/totalIn*100)+'%':'—','')}</div><div class="card"><h3>Lịch sử giao dịch trong kỳ</h3>${txTable(txs())}</div>`}
else if(page==='settings'){v.innerHTML=intro('Cài đặt','Quản lý hồ sơ, danh mục, giao diện và dữ liệu.')+`<div class="grid cols"><div class="card"><h3>Hồ sơ cá nhân</h3><div class="field"><label>Tên người dùng</label><input id="pname" value="${esc(state.profile.name)}"></div><div class="field"><label>Thu nhập dự kiến hàng tháng (VND)</label><input id="pincome" type="number" min="0" value="${state.profile.monthlyIncome}"></div><button class="btn primary" data-action="saveprofile">Lưu hồ sơ</button></div><div class="card"><h3>Giao diện</h3><p class="muted">Chọn giao diện phù hợp.</p><button class="btn" data-action="theme">${state.settings.theme==='dark'?'Chuyển sang Light Mode':'Chuyển sang Dark Mode'}</button><h3 style="margin-top:28px">Quản lý dữ liệu</h3><button class="btn" data-action="backup">↓ Xuất .vndsave</button> <button class="btn" data-action="import">↑ Nhập .vndsave</button><input id="backupfile" type="file" accept=".vndsave" hidden><p style="margin-top:18px"><button class="btn danger" data-action="wipe">Xóa toàn bộ dữ liệu</button></p></div></div><div class="card" style="margin-top:18px"><h3>Danh mục chi tiêu</h3>${state.categories.map(c=>`<div class="goalhead" style="padding:11px 0;border-bottom:1px solid var(--border)"><b>${esc(c.name)}</b><span><button class="btn smallbtn" data-editcat="${c.id}">Sửa</button> <button class="btn smallbtn danger" data-delcat="${c.id}">Xóa</button></span></div>`).join('')}<p><button class="btn" data-action="addcat">＋ Thêm danh mục</button></p></div>`}
}
function modal(title,body,saveLabel='Lưu'){let m=document.createElement('div');m.className='modalback';m.innerHTML=`<div class="modal"><h2>${title}</h2>${body}<div class="modalfoot"><button class="btn" data-close>Hủy</button><button class="btn primary" data-save>${saveLabel}</button></div></div>`;document.body.append(m);m.addEventListener('click',e=>{if(e.target===m||e.target.closest('[data-close]'))m.remove()});return m}
function transactionForm(t={}){let m=modal(t.id?'Sửa giao dịch':'Thêm giao dịch',`<div class="formgrid"><div class="field"><label>Loại giao dịch</label><select id="ftype"><option value="expense" ${t.type!=='income'?'selected':''}>Chi tiêu</option><option value="income" ${t.type==='income'?'selected':''}>Thu nhập</option></select></div><div class="field"><label>Ngày</label><input id="fdate" type="date" value="${t.date||today()}"></div><div class="field span2"><label>Tên giao dịch</label><input id="ftitle" value="${esc(t.title||'')}" placeholder="Ví dụ: Ăn trưa"></div><div class="field"><label>Số tiền (VND)</label><input id="famount" type="number" min="1" step="1" value="${t.amount||''}"></div><div class="field"><label>Danh mục</label><select id="fcat">${state.categories.map(c=>`<option value="${c.id}" ${t.categoryId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field span2"><label>Ghi chú (không bắt buộc)</label><textarea id="fnote">${esc(t.note||'')}</textarea></div></div>`);m.querySelector('[data-save]').onclick=async()=>{let cat=state.categories.find(c=>c.id===$('#fcat').value),amount=Number($('#famount').value),title=$('#ftitle').value.trim(),date=$('#fdate').value;if(!title||!Number.isSafeInteger(amount)||amount<=0||!date||!cat){toast('Vui lòng nhập đầy đủ thông tin hợp lệ.');return}let obj={id:t.id||uid(),type:$('#ftype').value,title,amount,categoryId:cat.id,categoryName:cat.name,date,note:$('#fnote').value.trim()};state.transactions=t.id?state.transactions.map(x=>x.id===t.id?obj:x):[obj,...state.transactions];m.remove();await persist();renderPage();toast('Đã lưu giao dịch.')}}
function categoryForm(c={}){let m=modal(c.id?'Sửa danh mục':'Thêm danh mục',`<div class="field"><label>Tên danh mục</label><input id="cname" value="${esc(c.name||'')}" placeholder="Tên danh mục"></div><div class="field"><label>Ngân sách tháng hiện tại (VND)</label><input id="cbudget" type="number" min="0" step="1" value="${c.id?budget(c):0}"></div>`);m.querySelector('[data-save]').onclick=async()=>{let name=$('#cname').value.trim(),amount=Number($('#cbudget').value);if(!name||!Number.isSafeInteger(amount)||amount<0){toast('Tên hoặc ngân sách không hợp lệ.');return}let cat=c.id?state.categories.find(x=>x.id===c.id):{id:uid()};cat.name=name;cat.budget=amount;if(!c.id)state.categories.push(cat);let b=state.budgets.find(x=>x.categoryId===cat.id&&x.month===month);if(b)b.amount=amount;else state.budgets.push({id:uid(),categoryId:cat.id,month,amount});m.remove();await persist();renderPage();toast('Đã lưu danh mục và ngân sách.')}}
function goalForm(){let m=modal('Tạo mục tiêu tiết kiệm',`<div class="field"><label>Tên mục tiêu</label><input id="gname" placeholder="Ví dụ: Mua sách"></div><div class="field"><label>Số tiền cần đạt (VND)</label><input id="gtarget" type="number" min="1"></div><div class="field"><label>Số tiền đã tiết kiệm (VND)</label><input id="gsaved" type="number" min="0" value="0"></div><div class="field"><label>Ngày mục tiêu</label><input id="gdate" type="date"></div><div class="field"><label>Ghi chú</label><textarea id="gnote"></textarea></div>`);m.querySelector('[data-save]').onclick=async()=>{let target=Number($('#gtarget').value),saved=Number($('#gsaved').value),name=$('#gname').value.trim();if(!name||!Number.isSafeInteger(target)||target<=0||!Number.isSafeInteger(saved)||saved<0){toast('Vui lòng kiểm tra thông tin mục tiêu.');return}state.savingsGoals.push({id:uid(),name,target,saved,date:$('#gdate').value,note:$('#gnote').value});m.remove();await persist();renderPage();toast('Đã tạo mục tiêu.')}}
function contribution(id,mode){let g=state.savingsGoals.find(x=>x.id===id);let m=modal(mode==='add'?'Nạp tiền vào mục tiêu':'Rút tiền khỏi mục tiêu',`<p>${esc(g.name)} · Hiện có ${money(g.saved)}</p><div class="field"><label>Số tiền (VND)</label><input id="conamount" type="number" min="1"></div>`,'Xác nhận');m.querySelector('[data-save]').onclick=async()=>{let n=Number($('#conamount').value);if(!Number.isSafeInteger(n)||n<=0||(mode==='remove'&&n>g.saved)){toast('Số tiền không hợp lệ.');return}g.saved+=mode==='add'?n:-n;m.remove();await persist();renderPage();toast('Đã cập nhật mục tiêu.')}}
function onboarding(){document.body.classList.remove('dark');$('#app').innerHTML=`<div class="onboard"><div class="brand"><img src="./public/assets/logo.svg">VND Save</div><div class="card"><div class="crumb">THIẾT LẬP BAN ĐẦU</div><h1>Chào mừng bạn đến với VND Save</h1><p class="muted">Thiết lập hồ sơ và ngân sách để bắt đầu quản lý tài chính cá nhân.</p><div class="field"><label>Tên người dùng</label><input id="onname" placeholder="Tên của bạn"></div><div class="field"><label>Thu nhập dự kiến hàng tháng (VND)</label><input id="onincome" type="number" min="0" value="0"></div><h3>Ngân sách theo danh mục</h3><div id="onCats">${defaults.map((c,i)=>`<div class="categoryline"><input data-name value="${c}"><input data-budget type="number" min="0" value="0" placeholder="Ngân sách"><button class="btn smallbtn" data-removecat>×</button></div>`).join('')}</div><button class="btn" id="onadd">＋ Thêm danh mục</button><div class="notice" id="onsummary">Tổng ngân sách: 0 ₫</div><button class="btn primary" id="onfinish">Hoàn tất thiết lập</button></div></div>`;$('#onCats').addEventListener('input',summary);$('#onCats').addEventListener('click',e=>{if(e.target.closest('[data-removecat]')){e.target.closest('.categoryline').remove();summary()}});$('#onadd').onclick=()=>{$('#onCats').insertAdjacentHTML('beforeend','<div class="categoryline"><input data-name placeholder="Tên danh mục"><input data-budget type="number" min="0" value="0"><button class="btn smallbtn" data-removecat>×</button></div>')};function summary(){let total=[...document.querySelectorAll('[data-budget]')].reduce((a,x)=>a+(Number(x.value)||0),0);$('#onsummary').textContent=`Tổng ngân sách: ${money(total)} · Thu nhập dự kiến: ${money($('#onincome').value)} · Còn lại: ${money(Number($('#onincome').value)-total)}`;$('#onsummary').style.color=total>Number($('#onincome').value)?'var(--red)':'var(--muted)'}$('#onincome').oninput=summary;$('#onfinish').onclick=async()=>{let name=$('#onname').value.trim(),inc=Number($('#onincome').value),rows=[...$('#onCats').querySelectorAll('.categoryline')],cats=rows.map(r=>({id:uid(),name:r.querySelector('[data-name]').value.trim(),budget:Number(r.querySelector('[data-budget]').value)}));if(!name||!Number.isSafeInteger(inc)||inc<0||cats.some(c=>!c.name||!Number.isSafeInteger(c.budget)||c.budget<0)){toast('Vui lòng kiểm tra tên, thu nhập và danh mục.');return}let total=cats.reduce((a,c)=>a+c.budget,0);if(total>inc&&!confirm('Tổng ngân sách đang lớn hơn thu nhập dự kiến. Bạn vẫn muốn tiếp tục?'))return;state={profile:{name,monthlyIncome:inc},categories:cats,transactions:[],budgets:cats.map(c=>({id:uid(),categoryId:c.id,month,amount:c.budget})),savingsGoals:[],settings:{theme:'light',onboarded:true}};await persist();page='dashboard';shell();toast('Thiết lập hoàn tất.')};summary()}
async function clickHandler(e){let b=e.target.closest('button');if(!b)return;if(b.dataset.page){page=b.dataset.page;shell();return}if(b.dataset.edit){transactionForm(state.transactions.find(t=>t.id===b.dataset.edit));return}if(b.dataset.del){let t=state.transactions.find(x=>x.id===b.dataset.del);if(confirm(`Xóa giao dịch “${t.title}”?`)){state.transactions=state.transactions.filter(x=>x.id!==t.id);await persist();renderPage()}return}if(b.dataset.editcat){categoryForm(state.categories.find(c=>c.id===b.dataset.editcat));return}if(b.dataset.delcat){let c=state.categories.find(x=>x.id===b.dataset.delcat);if(confirm(`Xóa danh mục ${c.name}? Giao dịch lịch sử vẫn được giữ.`)){state.categories=state.categories.filter(x=>x.id!==c.id);await persist();renderPage()}return}if(b.dataset.delgoal){if(confirm('Xóa mục tiêu này?')){state.savingsGoals=state.savingsGoals.filter(g=>g.id!==b.dataset.delgoal);await persist();renderPage()}return}if(b.dataset.goaladd){contribution(b.dataset.goaladd,'add');return}if(b.dataset.goalremove){contribution(b.dataset.goalremove,'remove');return}switch(b.dataset.action){case'addtx':transactionForm();break;case'addcat':categoryForm();break;case'addgoal':goalForm();break;case'theme':state.settings.theme=state.settings.theme==='dark'?'light':'dark';await persist();shell();break;case'backup':backup();break;case'import':$('#backupfile').click();break;case'csv':csv();break;case'saveprofile':{let n=$('#pname').value.trim(),i=Number($('#pincome').value);if(!n||!Number.isSafeInteger(i)||i<0){toast('Thông tin hồ sơ không hợp lệ.');break}state.profile={name:n,monthlyIncome:i};await persist();shell();toast('Đã lưu hồ sơ.');break}case'wipe':if(confirm('Xóa toàn bộ hồ sơ, danh mục, giao dịch, ngân sách, mục tiêu và cài đặt?')){state={profile:null,categories:[],transactions:[],budgets:[],savingsGoals:[],settings:{theme:'light'}};await persist();onboarding()}break}}
$('#app').addEventListener('click',clickHandler);
function backup(){let data={format:'vndsave',version:1,exportedAt:new Date().toISOString(),...state};let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});download(blob,`VND-Save-Backup-${today()}.vndsave`)}
function download(blob,name){let a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function csv(){let rows=[['Ngày','Loại','Tên giao dịch','Danh mục','Số tiền VND','Ghi chú'],...txs().map(t=>[t.date,t.type==='income'?'Thu nhập':'Chi tiêu',t.title,t.categoryName,t.amount,t.note||''])];let content='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');download(new Blob([content],{type:'text/csv;charset=utf-8'}),`VND-Save-${month}.csv`)}
$('#app').addEventListener('change',async e=>{if(e.target.id==='txmonth'||e.target.id==='budgetmonth'||e.target.id==='reportmonth'||e.target.id==='dashboardmonth'){month=e.target.value||month;renderPage()}if(e.target.id==='txfilter'||e.target.id==='txsearch'){let list=state.transactions.filter(t=>(e.target.id!=='txfilter'||e.target.value==='all'||t.type===e.target.value)&&(e.target.id!=='txsearch'||true));let q=$('#txsearch')?.value?.toLowerCase()||'',f=$('#txfilter')?.value||'all',m=$('#txmonth')?.value||month;list=list.filter(t=>(f==='all'||t.type===f)&&t.date.slice(0,7)===m&&(`${t.title} ${t.categoryName}`.toLowerCase().includes(q)));$('#txlist').innerHTML=txTable(list)}});
$('#app').addEventListener('input',e=>{if(e.target.id==='txsearch'){let q=e.target.value.toLowerCase(),f=$('#txfilter').value,m=$('#txmonth').value;$('#txlist').innerHTML=txTable(state.transactions.filter(t=>(f==='all'||t.type===f)&&t.date.slice(0,7)===m&&(`${t.title} ${t.categoryName}`.toLowerCase().includes(q))))}});
$('#app').addEventListener('change',e=>{if(e.target.id==='backupfile'&&e.target.files[0])importBackup(e.target.files[0])});async function importBackup(file){try{if(!file.name.endsWith('.vndsave'))throw Error('Chọn tệp .vndsave hợp lệ.');let d=JSON.parse(await file.text());if(d.format!=='vndsave'||d.version!==1||!d.profile||!Array.isArray(d.categories)||!Array.isArray(d.transactions)||!Array.isArray(d.budgets)||!Array.isArray(d.savingsGoals)||!d.settings)throw Error('Cấu trúc backup không hợp lệ hoặc không được hỗ trợ.');if(!confirm(`Khôi phục backup ngày ${d.exportedAt||'không rõ'}? Dữ liệu hiện tại sẽ bị thay thế.`))return;state={profile:d.profile,categories:d.categories,transactions:d.transactions,budgets:d.budgets,savingsGoals:d.savingsGoals,settings:d.settings};await persist();shell();toast('Đã khôi phục dữ liệu.')}catch(err){toast(err.message||'Không thể nhập backup.')}}
(async()=>{try{await load();if(!state.profile||!state.settings?.onboarded)onboarding();else shell()}catch(e){$('#app').innerHTML=`<div class="onboard"><div class="card"><h2>Không thể mở VND Save</h2><p>Trình duyệt không hỗ trợ IndexedDB hoặc đang chặn lưu trữ. Hãy mở bằng Chrome hoặc Edge và cho phép lưu dữ liệu cục bộ.</p><p class="muted">${esc(e.message)}</p></div></div>`}})();
})();
</script></body></html>
